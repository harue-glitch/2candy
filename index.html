<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ニーシーローハートー 数え方アプリ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap');
        
        body {
            font-family: 'Kosugi Maru', sans-serif;
            background-color: #FFF9E6; 
            touch-action: none; 
            /* モバイルブラウザのURLバーを考慮した高さ (dvh) */
            height: 100dvh;
            min-height: 100dvh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* チュートリアル：指とキャンディが一緒に左の箱へ移動するアニメーション */
        @keyframes tutorial-drag {
            0% { transform: translate(0, 0) scale(1); opacity: 0; }
            10% { transform: translate(0, 0) scale(1.1); opacity: 1; }
            20% { transform: translate(0, 0) scale(0.9); opacity: 1; } /* タッチした表現 */
            60% { transform: translate(-100px, 0) scale(0.9); opacity: 1; } /* 左の箱へドラッグ */
            70% { transform: translate(-100px, 0) scale(1); opacity: 0; } /* 離して箱に入ったところで消える */
            100% { transform: translate(0, 0) scale(1); opacity: 0; }
        }
        .animate-tutorial-hand {
            animation: tutorial-drag 3.5s infinite;
        }

        /* 文字がポンッと出るアニメーション */
        @keyframes pop-up {
            0% { transform: scale(0.5) translateY(20px); opacity: 0; }
            50% { transform: scale(1.2) translateY(-10px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop {
            animation: pop-up 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* はなまるのアニメーション */
        @keyframes draw-hanamaru {
            from { stroke-dashoffset: 1000; }
            to { stroke-dashoffset: 0; }
        }
        .hanamaru-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw-hanamaru 2s ease-out forwards;
        }

        @keyframes bounce-scale {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .animate-bounce-scale {
            animation: bounce-scale 2s infinite;
        }

        /* キャンディペアのスタイリング */
        .candy-pair {
            transition: transform 0.1s;
            z-index: 50; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }
        .candy-pair.dragging {
            transform: scale(1.2);
            z-index: 9999 !important; /* ドラッグ中は必ず一番手前に */
            opacity: 0.9;
            transition: none;
        }
        .candy-pair.dropped {
            transition: all 0.3s ease-out;
            pointer-events: none;
        }
        
        .slot {
            transition: background-color 0.2s;
        }
    </style>
</head>
<body class="flex flex-row relative">

    <!-- 【iOS音声対策】最初に画面をタッチさせるためのオーバーレイ -->
    <div id="initial-tap-overlay" class="absolute inset-0 bg-orange-100 z-[100] flex flex-col items-center justify-center cursor-pointer" onclick="handleInitialTap()">
        <div class="animate-bounce-scale bg-white p-6 md:p-10 rounded-3xl shadow-xl flex flex-col items-center">
            <span class="text-6xl md:text-8xl mb-4">👆</span>
            <p class="text-2xl md:text-4xl font-bold text-orange-500 tracking-widest text-center">がめんを<br>タッチしてね！</p>
        </div>
    </div>

    <!-- チュートリアル画面（オーバーレイ） -->
    <div id="tutorial-overlay" class="absolute inset-0 bg-black/70 z-50 flex flex-col items-center justify-center p-2 text-center text-white" style="display: none;">
        <div class="bg-white text-gray-800 p-4 md:p-8 rounded-2xl md:rounded-3xl shadow-2xl w-11/12 max-w-2xl max-h-[90dvh] flex flex-col items-center overflow-y-auto">
            <h1 class="text-2xl sm:text-4xl md:text-5xl font-bold mb-2 md:mb-6 leading-relaxed text-orange-500 tracking-widest cursor-pointer flex items-center justify-center gap-2" onclick="playTitleAudio(event)">
                2こずつ　わけよう <span class="text-2xl md:text-3xl text-gray-400 active:scale-95 transition-transform">🔊</span>
            </h1>
            
            <div class="flex justify-center items-center gap-4 md:gap-12 my-2 md:my-6 h-24 sm:h-32 bg-orange-50 rounded-2xl relative w-full overflow-hidden">
                <!-- 左側：子どもと枠 -->
                <div class="flex flex-col items-center z-10 w-1/2">
                    <span class="text-4xl sm:text-5xl">😭</span>
                    <!-- 枠 -->
                    <div class="w-16 h-8 sm:w-20 sm:h-10 border-4 border-dashed border-orange-300 rounded-xl mt-1 flex items-center justify-center bg-white relative">
                        <!-- ここにキャンディが入るイメージ -->
                    </div>
                </div>
                
                <!-- 右側：キャンディと指差し手 -->
                <div class="relative z-10 w-1/2 flex justify-center">
                    <!-- このラッパー全体が左へ移動する -->
                    <div class="animate-tutorial-hand relative">
                        <div class="text-2xl sm:text-4xl bg-white/90 p-1 sm:p-2 rounded-full shadow-md border-2 border-orange-200 flex items-center">
                            🍬🍬
                        </div>
                        <!-- チュートリアルの指差し (👆) -->
                        <div class="absolute -bottom-6 -right-4 sm:-bottom-8 sm:-right-6 text-3xl sm:text-5xl drop-shadow-lg">👆</div>
                    </div>
                </div>
            </div>

            <button id="start-btn" class="bg-orange-500 hover:bg-orange-600 text-white text-lg sm:text-xl md:text-2xl font-bold py-3 px-8 md:px-12 rounded-full shadow-lg transform transition active:scale-95 mt-2">
                スタート
            </button>
        </div>
    </div>

    <!-- ゲーム画面左側（2/3）：子どもたちとドロップゾーン -->
    <div class="h-full w-2/3 bg-blue-50 flex justify-evenly items-start pt-1 sm:pt-4">
        <!-- 子供1 -->
        <div class="kid-container flex flex-col items-center w-1/3 h-[95dvh] justify-start pt-1 sm:pt-4" data-kid-id="0">
            <div class="word-popup h-5 sm:h-8 md:h-10 mb-1 text-base sm:text-2xl md:text-3xl font-bold text-orange-600 opacity-0 flex items-center justify-center"></div>
            <div class="face text-3xl sm:text-4xl md:text-6xl transition-transform duration-300 transform mb-1" id="face-0">😭</div>
            <!-- スロットコンテナ -->
            <div class="slots-container flex flex-col-reverse gap-1 bg-blue-100/50 p-1 sm:p-2 rounded-xl w-14 sm:w-20 md:w-28 flex-1 max-h-[65dvh] mb-1" id="slots-0"></div>
        </div>
        <!-- 子供2 -->
        <div class="kid-container flex flex-col items-center w-1/3 h-[95dvh] justify-start pt-1 sm:pt-4" data-kid-id="1">
            <div class="word-popup h-5 sm:h-8 md:h-10 mb-1 text-base sm:text-2xl md:text-3xl font-bold text-orange-600 opacity-0 flex items-center justify-center"></div>
            <div class="face text-3xl sm:text-4xl md:text-6xl transition-transform duration-300 transform mb-1" id="face-1">😭</div>
            <div class="slots-container flex flex-col-reverse gap-1 bg-blue-100/50 p-1 sm:p-2 rounded-xl w-14 sm:w-20 md:w-28 flex-1 max-h-[65dvh] mb-1" id="slots-1"></div>
        </div>
        <!-- 子供3 -->
        <div class="kid-container flex flex-col items-center w-1/3 h-[95dvh] justify-start pt-1 sm:pt-4" data-kid-id="2">
            <div class="word-popup h-5 sm:h-8 md:h-10 mb-1 text-base sm:text-2xl md:text-3xl font-bold text-orange-600 opacity-0 flex items-center justify-center"></div>
            <div class="face text-3xl sm:text-4xl md:text-6xl transition-transform duration-300 transform mb-1" id="face-2">😭</div>
            <div class="slots-container flex flex-col-reverse gap-1 bg-blue-100/50 p-1 sm:p-2 rounded-xl w-14 sm:w-20 md:w-28 flex-1 max-h-[65dvh] mb-1" id="slots-2"></div>
        </div>
    </div>

    <!-- ゲーム画面右側（1/3）：キャンディ置き場（※overflow-hiddenを削除） -->
    <div id="candy-pool" class="h-full w-1/3 bg-orange-100 border-l-8 border-orange-200 relative p-1 md:p-4 z-10">
        <div class="absolute inset-0 flex items-center justify-center opacity-30 text-base sm:text-xl md:text-3xl font-bold text-orange-800 pointer-events-none text-center leading-relaxed px-1">
            <!-- 視覚的なヒントとして背景にテキスト配置 -->
        </div>
        <!-- Javascriptでキャンディペアを生成 -->
    </div>

    <!-- 成功画面 -->
    <div id="success-overlay" class="absolute inset-0 bg-white/90 z-40 hidden flex-col items-center justify-center text-center p-4">
        <!-- SVG はなまる。見切れないように viewBox を広く取る -->
        <svg viewBox="-50 -50 200 200" class="w-48 h-48 sm:w-64 sm:h-64 md:w-80 md:h-80 text-red-500 animate-bounce-scale overflow-visible">
            <circle cx="50" cy="50" r="35" fill="none" stroke="currentColor" stroke-width="3" class="hanamaru-path" />
            <path d="M50,15 C60,-5 85,5 85,25 C105,30 105,60 85,75 C85,95 60,105 50,85 C40,105 15,95 15,75 C-5,60 -5,30 15,25 C15,5 40,-5 50,15 Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="hanamaru-path" />
        </svg>
        <h2 class="text-3xl sm:text-5xl md:text-7xl font-bold text-red-500 mt-2 sm:mt-4 tracking-widest drop-shadow-md">できたね！</h2>
        <p class="text-base sm:text-xl md:text-2xl font-bold text-gray-700 mt-2">みんな笑顔になったよ！</p>
        <button onclick="location.reload()" class="mt-6 sm:mt-8 bg-blue-500 hover:bg-blue-600 text-white text-base sm:text-xl font-bold py-2 sm:py-3 px-6 sm:px-8 rounded-full shadow-md">
            もういちどあそぶ
        </button>
    </div>

    <script>
        // --- 状態管理 ---
        const kidsCount = [0, 0, 0];
        const words = ["ニー", "シー", "ロー", "ハー", "トー"];
        const readings = ["ニー", "シー", "ロー", "ハー", "トー"];
        const totalPairs = 15;
        let distributedPairs = 0;
        
        // --- iOS対応の堅牢な音声再生システム ---
        const synth = window.speechSynthesis;
        
        function speak(text) {
            if (!synth) return;
            
            // 重要: iOSの読み上げ詰まり（バグ）を防止するために、喋る前に必ずキャンセルする
            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP';
            utterance.rate = 0.9; 
            utterance.pitch = 1.2;
            synth.speak(utterance);
        }

        // 最初のタップ画面が押された時の処理（ここで確実にオーディオのロックを解除）
        function handleInitialTap() {
            // ナレーションを再生
            speak("にこずつ、わけよう");
            
            // タップ画面を隠して、チュートリアル画面を表示
            document.getElementById('initial-tap-overlay').style.display = 'none';
            document.getElementById('tutorial-overlay').style.display = 'flex';
        }

        // タイトルの 🔊 マークを押したときの処理 (何度でも鳴らせる)
        function playTitleAudio(e) {
            if(e) e.stopPropagation();
            speak("にこずつ、わけよう");
        }

        // --- DOM要素 ---
        const startBtn = document.getElementById('start-btn');
        const tutorialOverlay = document.getElementById('tutorial-overlay');
        const candyPool = document.getElementById('candy-pool');
        const successOverlay = document.getElementById('success-overlay');

        function initSlots() {
            for (let k = 0; k < 3; k++) {
                const slotsContainer = document.getElementById(`slots-${k}`);
                for (let i = 0; i < 5; i++) {
                    const slot = document.createElement('div');
                    // スマホ横向きでも収まるように min-h-[1.5rem] と flex-1 を組み合わせる
                    slot.className = 'slot w-full flex-1 min-h-[1.5rem] border-2 border-dashed border-blue-300 rounded-md sm:rounded-lg flex items-center justify-center bg-white/50 relative';
                    slot.dataset.kidIndex = k;
                    slot.dataset.slotIndex = i;
                    
                    const helperText = document.createElement('span');
                    helperText.className = 'text-[9px] sm:text-[10px] md:text-xs text-blue-300 absolute right-1 bottom-0 font-bold';
                    helperText.innerText = (i + 1) * 2;
                    slot.appendChild(helperText);

                    slotsContainer.appendChild(slot);
                }
            }
        }

        function initCandies() {
            const poolRect = candyPool.getBoundingClientRect();
            // キャンディサイズ
            const candyWidth = 40; 
            const candyHeight = 25;

            for (let i = 0; i < totalPairs; i++) {
                const pair = document.createElement('div');
                pair.className = 'candy-pair absolute flex items-center justify-center space-x-0 cursor-grab bg-white border-2 border-orange-200 rounded-full px-0.5 py-0.5 shadow-sm';
                pair.innerHTML = '<span class="text-lg sm:text-2xl md:text-3xl pointer-events-none">🍬</span><span class="text-lg sm:text-2xl md:text-3xl pointer-events-none">🍬</span>';
                
                const maxX = poolRect.width - candyWidth - 10;
                const maxY = poolRect.height - candyHeight - 10;
                
                const randomX = Math.max(5, Math.random() * (maxX > 0 ? maxX : 50));
                const randomY = Math.max(5, Math.random() * (maxY > 0 ? maxY : 50));

                pair.style.left = `${randomX}px`;
                pair.style.top = `${randomY}px`;
                
                setupDragEvents(pair);
                candyPool.appendChild(pair);
            }
        }

        let draggedElement = null;
        let startX = 0, startY = 0;
        let initialLeft = 0, initialTop = 0;
        let maxZIndex = 100; // 重なり順の管理変数

        function setupDragEvents(element) {
            element.addEventListener('touchstart', handleDragStart, {passive: false});
            element.addEventListener('touchmove', handleDragMove, {passive: false});
            element.addEventListener('touchend', handleDragEnd);
            element.addEventListener('mousedown', handleDragStart);
        }

        function handleDragStart(e) {
            if (e.target.classList.contains('dropped')) return;

            e.preventDefault(); 
            draggedElement = e.currentTarget;
            draggedElement.classList.add('dragging');
            
            // 新しく触った要素を必ず一番手前に持ってくる
            maxZIndex++;
            draggedElement.style.zIndex = maxZIndex;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            startX = clientX;
            startY = clientY;
            
            initialLeft = parseFloat(draggedElement.style.left) || 0;
            initialTop = parseFloat(draggedElement.style.top) || 0;

            if (!e.touches) {
                document.addEventListener('mousemove', handleDragMove);
                document.addEventListener('mouseup', handleDragEnd);
            }
        }

        function handleDragMove(e) {
            if (!draggedElement) return;
            e.preventDefault(); 

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const dx = clientX - startX;
            const dy = clientY - startY;

            draggedElement.style.left = `${initialLeft + dx}px`;
            draggedElement.style.top = `${initialTop + dy}px`;
        }

        function handleDragEnd(e) {
            if (!draggedElement) return;

            document.removeEventListener('mousemove', handleDragMove);
            document.removeEventListener('mouseup', handleDragEnd);

            draggedElement.classList.remove('dragging');

            const candyRect = draggedElement.getBoundingClientRect();
            const candyCenterX = candyRect.left + candyRect.width / 2;
            const candyCenterY = candyRect.top + candyRect.height / 2;

            let droppedOnKid = -1;

            const kidContainers = document.querySelectorAll('.kid-container');
            kidContainers.forEach((container, index) => {
                const rect = container.getBoundingClientRect();
                if (candyCenterX >= rect.left && candyCenterX <= rect.right &&
                    candyCenterY >= rect.top && candyCenterY <= rect.bottom) {
                    droppedOnKid = index;
                }
            });

            if (droppedOnKid !== -1 && kidsCount[droppedOnKid] < 5) {
                successDrop(droppedOnKid, draggedElement);
            } else {
                draggedElement.style.transition = 'all 0.3s ease-out';
                draggedElement.style.left = `${initialLeft}px`;
                draggedElement.style.top = `${initialTop}px`;
                setTimeout(() => {
                    draggedElement.style.transition = '';
                }, 300);
            }

            draggedElement = null;
        }

        function successDrop(kidIndex, element) {
            const currentCount = kidsCount[kidIndex]; 
            
            const slotsContainer = document.getElementById(`slots-${kidIndex}`);
            const targetSlot = slotsContainer.children[currentCount]; 

            targetSlot.innerHTML = ''; 
            targetSlot.appendChild(element);
            
            element.style.position = 'relative';
            element.style.left = '0';
            element.style.top = '0';
            element.style.transform = 'none';
            element.style.transition = 'none';
            // スロットに入ったらz-indexを初期化して無駄な重なりを防ぐ
            element.style.zIndex = '1';
            
            element.className = 'candy-pair dropped w-full h-full flex items-center justify-center space-x-0 bg-transparent border-none shadow-none';

            const emojis = element.querySelectorAll('span');
            emojis.forEach(e => {
                e.className = 'text-sm sm:text-lg md:text-xl pointer-events-none drop-shadow-sm';
            });

            kidsCount[kidIndex]++;
            distributedPairs++;

            showWord(kidIndex, currentCount);

            if (kidsCount[kidIndex] === 5) {
                const face = document.getElementById(`face-${kidIndex}`);
                face.innerText = '😃';
                face.style.transform = 'scale(1.2) translateY(-10px)';
                setTimeout(() => {
                    face.style.transform = 'scale(1) translateY(0)';
                }, 300);
            }

            if (distributedPairs === totalPairs) {
                setTimeout(showSuccess, 1000);
            }
        }

        function showWord(kidIndex, countIndex) {
            const container = document.querySelector(`.kid-container[data-kid-id="${kidIndex}"]`);
            const wordPopup = container.querySelector('.word-popup');
            
            wordPopup.innerText = words[countIndex];
            
            // ここで「ニー」「シー」等のナレーションを発声
            speak(readings[countIndex]);
            
            wordPopup.classList.remove('animate-pop');
            wordPopup.style.opacity = '0';
            
            requestAnimationFrame(() => {
                wordPopup.style.opacity = '1';
                wordPopup.classList.add('animate-pop');
            });

            setTimeout(() => {
                wordPopup.style.opacity = '0';
                wordPopup.classList.remove('animate-pop');
            }, 1200);
        }

        function showSuccess() {
            successOverlay.classList.remove('hidden');
            successOverlay.classList.add('flex');
            speak("できたね！");
        }

        // --- 初期化イベント ---
        startBtn.addEventListener('click', (e) => {
            if(e) e.stopPropagation(); 
            
            tutorialOverlay.style.opacity = '0';
            tutorialOverlay.style.transition = 'opacity 0.5s ease-out';
            setTimeout(() => {
                tutorialOverlay.style.display = 'none';
            }, 500);
        });

        window.onload = () => {
            initSlots();
            setTimeout(initCandies, 100);
        };
    </script>
</body>
</html>
